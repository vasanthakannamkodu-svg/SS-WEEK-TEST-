<script>
// Short celebratory sound for correct answers
function playCorrectSound(){
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    const ctx = new AudioContextClass();
    const now = ctx.currentTime;
    [880, 1175].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.12);
      gain.gain.setValueAtTime(0.0001, now + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.16, now + i * 0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.12);
      osc.stop(now + i * 0.12 + 0.24);
    });
    setTimeout(() => ctx.close(), 700);
  } catch (e) { console.log('Correct-answer sound unavailable:', e); }
}

  {"q_en":"How can a teacher address gender bias in Social Science textbooks?","q_ml":"","o":["Skip those chapters","Highlight and discuss with students","Ignore it","Teach as written"],"a":1,"e":"Discussing bias openly helps students develop critical media literacy and recognize societal stereotypes."},
  {"q_en":"Which of the following is NOT a suitable assessment method for Social Science?","q_ml":"","o":["Rote memory testing only","Debate on social issues","Map-based questions","Project work"],"a":0,"e":"Social Science aims to develop critical thinking, civic awareness, and application, which rote memory testing fails to measure."},
  {"q_en":"To teach \"Indian Constitution\" effectively, a teacher should:","q_ml":"","o":["Skip preambles","Dictate articles","Focus on memorization","Use case studies and real-life examples"],"a":3,"e":"Case studies (like Supreme Court rulings) help students see how constitutional articles apply to real-world rights and governance."},
  {"q_en":"Which of the following is a good way to teach \"cultural diversity\"?","q_ml":"","o":["Teach one culture only","Celebrate different cultures in class","Avoid discussion","Lecture only"],"a":1,"e":"Celebrating diverse cultures promotes inclusivity, empathy, and mutual respect among students."},
  {"q_en":"A student asks, \"Why study history if it's already happened?\" How should the teacher respond?","q_ml":"","o":["Say it's compulsory","Explain relevance to present and future","Punish for questioning","Ignore the question"],"a":1,"e":"Connecting past events to current societal structures helps students appreciate history as the foundation of the present."},

  {"q_en":"To teach \"globalization\" effectively, a teacher should:","q_ml":"","o":["Use news articles and case studies","Teach only theory","Focus on definitions","Avoid examples"],"a":0,"e":"News articles and case studies reveal the real-time economic, cultural, and political impacts of globalization."},

  {"q_en":"A student struggles with understanding timelines. What's the best strategy?","q_ml":"","o":["Punish for mistakes","Use visual aids and interactive timelines","Ignore timelines","Skip history"],"a":1,"e":"Visual aids and interactive digital or physical timelines provide concrete references that help students grasp chronological sequences."},

  {"q_en":"How can a teacher make Social Science inclusive for students with learning disabilities?","q_ml":"","o":["Exclude from class","Reduce expectations","Differentiate instruction and use multisensory materials","Use one teaching method"],"a":2,"e":"Differentiating instruction ensures content is accessible, and multisensory materials cater to various learning profiles."}
];

const KEYS = ['A', 'B', 'C', 'D'];
let ans = new Array(Q.length).fill(-1);
let done = new Array(Q.length).fill(false);

let globalTimeLeft = 5400; // 90 minutes for 80 questions 
let globalTmr = null;

function startGlobalTimer(){
  if(globalTmr) return; 
  updTimerDisplay();
  globalTmr = setInterval(() => {
    globalTimeLeft--;
    updTimerDisplay();
    if(globalTimeLeft <= 0){
      clearInterval(globalTmr);
      globalTmr = null;
      showResults();
    }
  }, 1000);
}

function updTimerDisplay(){
  const el = document.getElementById('tmr');
  if(!el) return;
  const mins = Math.floor(globalTimeLeft / 60);
  const secs = globalTimeLeft % 60;
  el.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
  if(globalTimeLeft <= 120){
    el.className = 'timer-txt red';
  } else {
    el.className = 'timer-txt';
  }
}

function renderAllQuestions(){
  let html = `
  <div class="top-bar">
    <div class="header-profile">
      <div class="header-text-block">
        <span class="quiz-title">K-TET CATEGORY III – MODEL TEST</span>
        <span class="quiz-subtitle">Social Science & Pedagogy | 80 MCQs</span>
        <div style="margin-top: 2px;"><a href="https://guruplusblog.blogspot.com/" target="_blank" style="color: #93C5FD; font-size: 11px; font-weight: 600; text-decoration: none; word-break: break-all;">https://guruplusblog.blogspot.com/</a></div>
      </div>
      <div class="header-actions">
        <a href="https://wa.me/919539846888" target="_blank" class="whatsapp-btn">
          WhatsApp
        </a>
        <img src="myphoto.jpeg" alt="Profile" class="profile-pic" onerror="this.style.display='none'">
      </div>
    </div>
    <div class="top-row" style="margin-top: 10px;">
      <div class="timer-pill">
        <span class="timer-label" style="margin-right:4px;">Time Left:</span>
        <span class="timer-txt" id="tmr">90:00</span>
      </div>
      <span class="q-badge">Total: ${Q.length}</span>
    </div>
  </div>`;

  Q.forEach((q, qIdx) => {
    const isD = done[qIdx];
    const ua = ans[qIdx];

    let optsHtml = q.o.map((o, oIdx) => {
      let cls = 'opt';
      if (isD) {
        if (oIdx === q.a) cls += ' correct-ans';
        else if (oIdx === ua) cls += ' wrong-ans';
        else cls += ' neutral-locked';
      } else {
        cls += ' unanswered';
      }
      return `<div class="${cls}" onclick="pick(${qIdx}, ${oIdx})"><span class="opt-key ${KEYS[oIdx]}">${KEYS[oIdx]}</span><span class="opt-txt">${o}</span></div>`;
    }).join('');

    let expHtml = '';
    if (isD) {
      const ok = ua === q.a;
      expHtml = `<div class="exp-box ${ok ? 'correct' : 'wrong'}"><div class="exp-label">${ok ? '✓ Answered Correctly!' : '✗ Incorrect'}</div>${q.e}</div>`;
    }

    html += `
    <div class="q-container" id="q-box-${qIdx}">
      <div class="q-num">Question ${qIdx + 71}</div>
      <div class="q-text-en">${q.q_en.replace(/\n/g, '<br>')}</div>
      ${q.q_ml ? `<div class="q-text-ml">${q.q_ml}</div>` : ''}
      <div class="opts">${optsHtml}</div>
      ${expHtml}
    </div>`;
  });

  html += `
  <div class="action-container">
    <button class="btn-submit-all" onclick="showResults()">Submit Test</button>
  </div>`;

  document.getElementById('app').innerHTML = html;
  updTimerDisplay();
}

function pick(qIdx, oIdx){
  if(done[qIdx]) return;
  ans[qIdx] = oIdx;
  done[qIdx] = true;

  const q = Q[qIdx];
  const ua = ans[qIdx];
  const ok = ua === q.a;

  if (ok) {
    playCorrectSound();
  }

  const qBox = document.getElementById(`q-box-${qIdx}`);
  if(qBox) {
    let optsHtml = q.o.map((o, idx) => {
      let cls = 'opt';
      if (idx === q.a) cls += ' correct-ans';
      else if (idx === ua) cls += ' wrong-ans';
      else cls += ' neutral-locked';
      return `<div class="${cls}" onclick="pick(${qIdx}, ${idx})"><span class="opt-key ${KEYS[idx]}">${KEYS[idx]}</span><span class="opt-txt">${o}</span></div>`;
    }).join('');

    let expHtml = `<div class="exp-box ${ok ? 'correct' : 'wrong'}"><div class="exp-label">${ok ? '✓ Answered Correctly!' : '✗ Incorrect'}</div>${q.e}</div>`;

    qBox.innerHTML = `
      <div class="q-num">Question ${qIdx + 71}</div>
      <div class="q-text-en">${q.q_en.replace(/\n/g, '<br>')}</div>
      ${q.q_ml ? `<div class="q-text-ml">${q.q_ml}</div>` : ''}
      <div class="opts">${optsHtml}</div>
      ${expHtml}
    `;
  }
}

function showResults(){
  if(globalTmr) {
    clearInterval(globalTmr);
    globalTmr = null;
  }
  let c=0, w=0, s=0;
  ans.forEach((a, i) => { if(a === -1) s++; else if(a === Q[i].a) c++; else w++; });
  const pct = Math.round((c / Q.length) * 100);
  const grade = pct >= 80 ? 'Excellent!' : pct >= 60 ? 'Good effort!' : pct >= 40 ? 'Keep practising' : 'Keep going!';

  let rev = Q.map((q, i) => {
    const ua = ans[i], isC = ua === q.a, isS = ua === -1;
    const rc = isS ? 'rs' : isC ? 'rc' : 'rw';
    const bl = isS ? 'Skipped' : isC ? 'Answered' : 'Wrong';
    return `<div class="r-card ${rc}">
      <div class="r-head"><span class="r-badge ${rc}">${bl}</span><span class="r-head"> Q${i+71}</span></div>
      <div class="r-qtxt-en">${q.q_en.replace(/\n/g, '<br>')}</div>
      ${q.q_ml ? `<div class="q-text-ml">${q.q_ml}</div>` : ''}
      ${!isS && !isC ? `<div class="r-ans wrong">Your answer: ${KEYS[ua]}.${q.o[ua]}</div>` : ''}
      <div class="r-ans correct">Correct Option key: ${KEYS[q.a]}. ${q.o[q.a]}</div>
      <div class="r-exp">${q.e}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
  <div class="result-top">
    <div class="score-ring"><span class="score-big">${c}</span><span class="score-sub">/ ${Q.length}</span></div>
    <div class="result-label">${grade}</div>
    <div class="result-sub">${pct}% · ${c} correct out of ${Q.length}</div>
  </div>
  <div class="stats-grid">
    <div class="stat-c green"><div class="stat-n">${c}</div><div class="stat-l">Correct</div></div>
    <div class="stat-c red"><div class="stat-n">${w}</div><div class="stat-l">Wrong</div></div>
    <div class="stat-c gray"><div class="stat-n">${s}</div><div class="stat-l">Skipped</div></div>
  </div>
  <div class="review-title">Full review</div>
  ${rev}
  <button class="restart-btn" onclick="restartQuiz()">Restart quiz</button>`;
  window.scrollTo(0,0);
}

function restartQuiz(){
  ans = new Array(Q.length).fill(-1);
  done = new Array(Q.length).fill(false);
  globalTimeLeft = 5400;
  startGlobalTimer();
  renderAllQuestions();
  window.scrollTo(0,0);
}

startGlobalTimer();
renderAllQuestions();
</script>
